name: Generate profile stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output dir
        run: mkdir -p dist

      # ----------------------------
      # GitHub Readme Stats (main + langs)
      # ----------------------------
      - name: Generate stats cards
        run: |
          docker run --rm \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -v $PWD/dist:/out \
            anuraghazra/github-readme-stats:latest \
            --username ecstra \
            --output /out/stats.svg

          docker run --rm \
            -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -v $PWD/dist:/out \
            anuraghazra/github-readme-stats:latest \
            --username ecstra \
            --top-langs \
            --output /out/top-langs.svg

      # ----------------------------
      # Streak stats
      # ----------------------------
      - name: Generate streak stats
        run: |
          docker run --rm \
            -v $PWD/dist:/out \
            denvercoder1/github-readme-streak-stats \
            --username ecstra \
            --output /out/streak.svg

      # ----------------------------
      # Activity graph
      # ----------------------------
      - name: Generate activity graph
        run: |
          docker run --rm \
            -v $PWD/dist:/out \
            ashutosh00710/github-readme-activity-graph \
            --username ecstra \
            --output /out/activity.svg

      # ----------------------------
      # Publish to output branch
      # ----------------------------
      - name: Publish images
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
