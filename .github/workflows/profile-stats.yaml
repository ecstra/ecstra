name: Generate Cool Metrics

on:
  schedule:
    - cron: "0 */12 * * *"  # Metrics is heavy, 12 hours is better
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      # --- GRAPH 1: Main Stats (Languages, Habits, Stargazers) ---
      - name: Generate Main Metrics
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          output_action: none # Don't commit yet, just save file
          committer_branch: output
          
          # Options
          user: ecstra
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          theme: night
          
          # Plugins
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact

      - name: Move Main Metrics to dist
        run: mv metrics.svg dist/metrics.svg || echo "Main metrics failed"

      # --- GRAPH 2: 3D Isometric Calendar (Replaces standard activity graph) ---
      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: isocalendar.svg
          output_action: none
          
          # Options
          user: ecstra
          template: classic
          base: "" # We only want the calendar here
          config_timezone: Asia/Kolkata
          theme: night
          
          # Plugin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Move Calendar to dist
        run: mv isocalendar.svg dist/isocalendar.svg || echo "Calendar failed"

      # --- GRAPH 3: Snake Animation ---
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        id: snake
        continue-on-error: true
        with:
          github_user_name: ecstra
          outputs: dist/snake.svg?palette=github-dark

      # --- SAFETY NET: Restore old versions if new ones failed ---
      - name: Fetch previous versions if current failed
        continue-on-error: true
        run: |
          git fetch origin output:output-branch || true
          
          # Function to restore file if missing
          restore_if_missing() {
            local file=$1
            if [ ! -f "dist/$file" ] || [ ! -s "dist/$file" ]; then
              echo "$file failed to generate, checking for previous version..."
              if git show output-branch:$file > "dist/$file" 2>/dev/null && [ -s "dist/$file" ]; then
                echo "Restored previous $file"
              else
                echo "No previous version found for $file"
              fi
            fi
          }
          
          restore_if_missing "metrics.svg"
          restore_if_missing "isocalendar.svg"
          restore_if_missing "snake.svg"

      # --- DEPLOY ---
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update metrics graphs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
