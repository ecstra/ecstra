name: Generate Cool Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      # --- GRAPH 1: Main Stats ---
      # I removed 'continue-on-error' so we can see the real error in logs
      - name: Generate Main Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          output_action: none
          committer_branch: output
          user: ecstra
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          theme: night
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: lines, percentage
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact

      - name: Move Main Metrics to dist
        run: mv metrics.svg dist/metrics.svg

      # --- GRAPH 2: 3D Isometric Calendar ---
      - name: Generate Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: isocalendar.svg
          output_action: none
          user: ecstra
          template: classic
          base: "" 
          config_timezone: Asia/Kolkata
          theme: night
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Move Calendar to dist
        run: mv isocalendar.svg dist/isocalendar.svg

      # --- GRAPH 3: Snake Animation ---
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: ecstra
          outputs: dist/snake.svg?palette=github-dark

      # --- DEPLOY ---
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update metrics graphs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
