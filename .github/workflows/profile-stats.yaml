name: Generate Reliable GitHub Graphs

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-graphs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create graphs directory
        run: mkdir -p dist

      # --- 1. GITHUB STATS ---
      # FIX: Changed '&hide=c' to '&hide_rank=true'
      - name: Generate GitHub Stats
        id: stats
        continue-on-error: true
        run: |
          STATS_URL="https://github-readme-stats.vercel.app/api?username=ecstra&show_icons=true&theme=radical&hide_border=true&count_private=true&hide_rank=true"
          
          curl -f -o dist/stats.svg "$STATS_URL" || \
          curl -f -o dist/stats.svg "https://github-readme-stats-sigma-five.vercel.app/api?username=ecstra&show_icons=true&theme=radical&hide_border=true&count_private=true&hide_rank=true" || \
          echo "Stats generation failed"

      # --- 2. TOP LANGUAGES ---
      - name: Generate Top Languages
        id: languages
        continue-on-error: true
        run: |
          LANG_URL="https://github-readme-stats.vercel.app/api/top-langs/?username=ecstra&layout=compact&theme=radical&hide_border=true&langs_count=8"
          
          curl -f -o dist/languages.svg "$LANG_URL" || \
          curl -f -o dist/languages.svg "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=ecstra&layout=compact&theme=radical&hide_border=true&langs_count=8" || \
          echo "Languages generation failed"

      # --- 3. STREAK STATS ---
      - name: Generate Streak Stats
        id: streak
        continue-on-error: true
        run: |
          STREAK_URL="https://streak-stats.demolab.com/?user=ecstra&theme=radical&hide_border=true"
          
          curl -f -o dist/streak.svg "$STREAK_URL" || \
          curl -f -o dist/streak.svg "https://github-readme-streak-stats.herokuapp.com/?user=ecstra&theme=radical&hide_border=true" || \
          echo "Streak generation failed"

      # --- 4. SNAKE ANIMATION ---
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ecstra
          outputs: dist/snake.svg?palette=github-dark

      # --- 5. SAFETY CHECKS (The "Reliable" Logic) ---
      - name: Verify and Restore Previous Versions
        continue-on-error: true
        run: |
          git fetch origin output:output-branch || true
          
          # Helper function to check validity and restore if needed
          check_and_restore() {
            local file=$1
            local min_size=$2
            
            # Condition 1: File doesn't exist or is empty
            if [ ! -f "dist/$file" ] || [ ! -s "dist/$file" ]; then
              echo "MISSING: $file is missing. Attempting restore..."
              git show output-branch:$file > "dist/$file" 2>/dev/null || echo "  -> No previous version found."
              return
            fi

            # Condition 2: File exists but is too small (likely an error message SVG)
            local size=$(wc -c < "dist/$file")
            if [ $size -lt $min_size ]; then
              echo "BROKEN: $file is too small ($size bytes). Likely an error SVG. Attempting restore..."
              # Try to restore into a temp file first
              if git show output-branch:$file > "dist/${file}.tmp" 2>/dev/null; then
                 # Only overwrite if the old one is actually valid/larger
                 if [ $(wc -c < "dist/${file}.tmp") -gt $min_size ]; then
                    mv "dist/${file}.tmp" "dist/$file"
                    echo "  -> Restored previous valid version."
                 else
                    rm "dist/${file}.tmp"
                    echo "  -> Previous version was also broken/missing."
                 fi
              else
                 echo "  -> No previous version found to restore."
              fi
            else
              echo "OK: $file seems valid ($size bytes)."
            fi
          }

          # Check Stats (Fail if < 1KB)
          check_and_restore "stats.svg" 1000
          
          # Check Languages (Fail if < 600 bytes)
          check_and_restore "languages.svg" 600
          
          # Check Streak (Fail if < 800 bytes)
          check_and_restore "streak.svg" 800
          
          # Check Snake (Fail if < 2KB)
          check_and_restore "snake.svg" 2000

      # --- 6. FINAL PLACEHOLDERS (Last Resort) ---
      - name: Ensure No Broken Links
        run: |
          for file in stats languages streak; do
            if [ ! -f "dist/${file}.svg" ] || [ ! -s "dist/${file}.svg" ]; then
              echo "Creating placeholder for ${file}.svg"
              cat > "dist/${file}.svg" <<'EOF'
          <svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
            <rect width="400" height="100" fill="#0d1117"/>
            <text x="200" y="50" font-family="Arial" font-size="16" fill="#c9d1d9" text-anchor="middle">Graph temporarily unavailable</text>
          </svg>
          EOF
            fi
          done

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update graphs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
