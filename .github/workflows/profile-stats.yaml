name: Generate Reliable GitHub Graphs

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-graphs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create graphs directory
        run: mkdir -p dist

      - name: Generate GitHub Stats
        id: stats
        continue-on-error: true
        run: |
          STATS_URL="https://github-readme-stats.vercel.app/api?username=ecstra&show_icons=true&theme=radical&hide_border=true&count_private=true&rank_icon=github"
          
          curl -f -o dist/stats.svg "$STATS_URL" || \
          curl -f -o dist/stats.svg "https://github-readme-stats-sigma-five.vercel.app/api?username=ecstra&show_icons=true&theme=radical&hide_border=true&count_private=true&rank_icon=github" || \
          curl -f -o dist/stats.svg "https://github-readme-stats.vercel.app/api?username=ecstra&show_icons=true&theme=dark&hide_border=true&rank_icon=github" || \
          echo "Stats generation failed, will use previous version"

      - name: Generate Top Languages
        id: languages
        continue-on-error: true
        run: |
          LANG_URL="https://github-readme-stats.vercel.app/api/top-langs/?username=ecstra&layout=compact&theme=radical&hide_border=true&langs_count=8&rank_icon=github"
          
          curl -f -o dist/languages.svg "$LANG_URL" || \
          curl -f -o dist/languages.svg "https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=ecstra&layout=compact&theme=radical&hide_border=true&langs_count=8&rank_icon=github" || \
          curl -f -o dist/languages.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=ecstra&layout=compact&theme=dark&hide_border=true&langs_count=8&rank_icon=github" || \
          echo "Languages generation failed, will use previous version"

      - name: Generate Streak Stats
        id: streak
        continue-on-error: true
        run: |
          STREAK_URL="https://streak-stats.demolab.com/?user=ecstra&theme=radical&hide_border=true"
          
          curl -f -o dist/streak.svg "$STREAK_URL" || \
          curl -f -o dist/streak.svg "https://github-readme-streak-stats.herokuapp.com/?user=ecstra&theme=radical&hide_border=true" || \
          curl -f -o dist/streak.svg "https://nirzak-streak-stats.vercel.app/?user=ecstra&theme=radical&hide_border=true" || \
          echo "Streak generation failed, will use previous version"

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ecstra
          outputs: dist/snake.svg?palette=github-dark

      - name: Create metadata file
        run: |
          cat > dist/metadata.json << EOF
          {
            "last_updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "stats_status": "${{ steps.stats.outcome }}",
            "languages_status": "${{ steps.languages.outcome }}",
            "streak_status": "${{ steps.streak.outcome }}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF

      - name: Fetch previous versions if current failed
        continue-on-error: true
        run: |
          git fetch origin output:output-branch || true
          
          if [ ! -f dist/stats.svg ] || [ ! -s dist/stats.svg ]; then
            echo "Stats generation failed, checking for previous version..."
            if git show output-branch:stats.svg > dist/stats.svg 2>/dev/null && [ -s dist/stats.svg ]; then
              echo "Using previous stats.svg"
            else
              echo "No previous stats found, will create placeholder"
              rm -f dist/stats.svg
            fi
          fi
          
          if [ -f dist/stats.svg ] && [ $(wc -c < dist/stats.svg) -lt 1000 ]; then
            echo "Stats.svg is suspiciously small, checking for previous version..."
            if git show output-branch:stats.svg > /tmp/old_stats.svg 2>/dev/null && [ $(wc -c < /tmp/old_stats.svg) -gt 1000 ]; then
              echo "Using previous stats.svg (current one appears broken)"
              mv /tmp/old_stats.svg dist/stats.svg
            fi
          fi
          
          if [ ! -f dist/languages.svg ] || [ ! -s dist/languages.svg ]; then
            echo "Languages generation failed, checking for previous version..."
            if git show output-branch:languages.svg > dist/languages.svg 2>/dev/null && [ -s dist/languages.svg ]; then
              echo "Using previous languages.svg"
            else
              echo "No previous languages found, will create placeholder"
              rm -f dist/languages.svg
            fi
          fi
          
          if [ ! -f dist/streak.svg ] || [ ! -s dist/streak.svg ]; then
            echo "Streak generation failed, checking for previous version..."
            if git show output-branch:streak.svg > dist/streak.svg 2>/dev/null && [ -s dist/streak.svg ]; then
              echo "Using previous streak.svg"
            else
              echo "No previous streak found, will create placeholder"
              rm -f dist/streak.svg
            fi
          fi

      - name: Verify all files exist
        run: |
          echo "Checking generated files..."
          ls -lh dist/
          
          for file in stats languages streak; do
            if [ ! -f "dist/${file}.svg" ]; then
              echo "No current or previous version found for ${file}.svg - creating placeholder"
              cat > "dist/${file}.svg" <<'PLACEHOLDER'
          <svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ff006e;stop-opacity:0.1" />
                <stop offset="100%" style="stop-color:#8338ec;stop-opacity:0.05" />
              </linearGradient>
            </defs>
            <rect width="495" height="195" fill="#0d1117" rx="4.5"/>
            <rect width="495" height="195" fill="url(#grad)" rx="4.5"/>
            <text x="247.5" y="85" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#ff006e" text-anchor="middle" font-weight="600">Graph temporarily unavailable</text>
            <text x="247.5" y="115" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Will retry in a few hours</text>
          </svg>
          PLACEHOLDER
            fi
          done
          
          if [ ! -f "dist/snake.svg" ]; then
            echo "ERROR: Snake animation failed to generate!"
          fi

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update graphs - ${{ steps.stats.outcome }}/${{ steps.languages.outcome }}/${{ steps.streak.outcome }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
