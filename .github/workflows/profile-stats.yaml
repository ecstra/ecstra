name: Generate Reliable GitHub Graphs

on:
  schedule:
    - cron: "0 0 * * *" # Runs every 24 hours at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-graphs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create graphs directory
        run: mkdir -p dist

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: master # Uses the latest nightly to match your local 0.16.0+

      - name: Checkout custom stats generator
        uses: actions/checkout@v4
        with:
          repository: ecstra/github-readme-stats
          ref: master # Now correctly pulling from master branch!
          path: stats-generator
          token: ${{ secrets.STATS_TOKEN }} # Required to clone the private repo

      - name: Generate GitHub Stats
        id: stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
        run: |
          cd stats-generator
          zig build
          
          # Only pass the exclude flag if the secret actually has text in it
          if [ -z "$EXCLUDE_REPOS" ]; then
            ./zig-out/bin/github-stats --access-token $GITHUB_TOKEN
          else
            ./zig-out/bin/github-stats --access-token $GITHUB_TOKEN --exclude-repos "$EXCLUDE_REPOS"
          fi
          
          # Move them to the dist folder, renaming overview to stats.svg
          cp overview.svg ../dist/stats.svg
          cp languages.svg ../dist/languages.svg
          cp streak.svg ../dist/streak.svg

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ecstra
          outputs: dist/snake.svg?palette=github-dark

      - name: Create metadata file
        run: |
          cat > dist/metadata.json << EOF
          {
            "last_updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "stats_status": "${{ steps.stats.outcome }}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF

      - name: Fetch previous versions if current failed
        continue-on-error: true
        run: |
          git fetch origin output:output-branch || true

          for file in stats languages streak; do
            if [ ! -f "dist/${file}.svg" ] || [ ! -s "dist/${file}.svg" ]; then
              if git show "output-branch:${file}.svg" > "dist/${file}.svg" 2>/dev/null && [ -s "dist/${file}.svg" ]; then
                echo "Using previous ${file}.svg"
              else
                rm -f "dist/${file}.svg"
              fi
            fi
          done

      - name: Verify all files exist
        run: |
          echo "Checking generated files..."
          ls -lh dist/

          for file in stats languages streak; do
            if [ ! -f "dist/${file}.svg" ]; then
              cat > "dist/${file}.svg" <<'PLACEHOLDER'
          <svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
            <rect width="495" height="195" fill="#070a0f" rx="8"/>
            <text x="247.5" y="95" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" fill="#f15a24" text-anchor="middle" font-weight="600">Graph temporarily unavailable</text>
            <text x="247.5" y="125" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#9da5b4" text-anchor="middle">Will retry in a few hours</text>
          </svg>
          PLACEHOLDER
            fi
          done

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update graphs - ${{ steps.stats.outcome }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
