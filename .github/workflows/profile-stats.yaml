name: Generate Profile Stats

on:
  schedule:
    # Fix: Run at minute 0 of every 12th hour (00:00 and 12:00)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      - name: Download Stats (Resilient)
        run: |
          # Function: Try to download new file. If fail, keep the old one from the output branch.
          download_stat() {
            target_url="$1"
            filename="$2"
            backup_url="https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.repository }}/output/$filename"

            echo "-----------------------------------"
            echo "Processing: $filename"

            # 1. Download the CURRENT working file from your output branch (as backup)
            # We use -s (silent) and continue even if it fails (e.g., first run)
            curl -s -L -o "dist/$filename" "$backup_url" || true

            # 2. Try to download the NEW stats to a temp file
            # -f fails on HTTP errors (like 503)
            # --connect-timeout 10 prevents hanging forever
            if curl -f -s -L --connect-timeout 10 -o "dist/$filename.tmp" "$target_url"; then
              # If success, overwrite the backup with the new file
              mv "dist/$filename.tmp" "dist/$filename"
              echo "✅ Success: Updated $filename"
            else
              # If fail, just delete the temp file and keep the backup
              rm -f "dist/$filename.tmp"
              echo "⚠️ Service Down (503). Keeping previous working version of $filename."
            fi
          }

          # Top Languages
          download_stat "https://github-readme-stats.vercel.app/api/top-langs?username=${{ github.repository_owner }}&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false&order=2" "top-langs.svg"

          # Streak Stats
          download_stat "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&locale=en&mode=daily&theme=dracula&hide_border=false&border_radius=5&order=3" "streak.svg"

          # Trophies
          download_stat "https://github-profile-trophy.vercel.app?username=${{ github.repository_owner }}&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false&order=4" "trophy.svg"

          # Activity Graph
          download_stat "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&radius=16&theme=dracula&area=true&order=5" "activity-graph.svg"

      - name: Push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
