name: Generate Profile Stats

on:
  schedule:
    # Execute every 12 hours
    - cron: "* */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Create a dist directory to hold all the assets
      - name: Create dist directory
        run: mkdir -p dist

      # 2. Generate the Snake Animation (Your existing step)
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      # 3. Download the Stats SVGs (New step)
      # We use curl with -f (fail silently) so if the service is down, the workflow fails 
      # and does NOT overwrite your valid previous images.
      - name: Download Stats SVGs
        run: |
          # Top Languages
          curl -f -o dist/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs?username=${{ github.repository_owner }}&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false&order=2"
          
          # Streak Stats
          curl -f -o dist/streak.svg "https://streak-stats.demolab.com?user=${{ github.repository_owner }}&locale=en&mode=daily&theme=dracula&hide_border=false&border_radius=5&order=3"
          
          # Trophies
          curl -f -o dist/trophy.svg "https://github-profile-trophy.vercel.app?username=${{ github.repository_owner }}&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false&order=4"
          
          # Activity Graph
          curl -f -o dist/activity-graph.svg "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&radius=16&theme=dracula&area=true&order=5"

      # 4. Push everything in 'dist' to the 'output' branch
      - name: Push assets to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
